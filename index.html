<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>ABC College</h1>
        <p>Student Online Portal<br>
        Login to view Attendance, Marks & Notices</p>
    </div>

    <div class="right">
        <h2>Student Login</h2>

        <form>
            <input type="text" placeholder="Register Number" required>
            <input type="text" placeholder="Student Name" required>
            <input type="password" placeholder="Password" required>
            <button>LOGIN</button>
        </form>

        <div class="links">
            <a href="#">Forgot Password?</a> |
            <a href="#">New Student?</a>
        </div>
    </div>

</div>

</body>
</html>
