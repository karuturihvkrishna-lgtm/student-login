<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Student Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
    margin:0;
    height:100vh;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#1d2671,#c33764);
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:900px;
    height:520px;
    background:#fff;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.left{
    width:50%;
    background:url("https://images.unsplash.com/flagged/photo-1571260899304-425eee4c7efc?auto=format&fit=crop&w=1000&q=80");
    background-size:cover;
    position:relative;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    color:#fff;
    padding:40px;
}

.overlay h1{font-size:34px;}
.overlay p{font-size:18px;}

.right{
    width:50%;
    padding:50px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.input-box{
    position:relative;
    margin:25px 0;
}

.input-box input{
    width:100%;
    padding:12px 40px;
    border-radius:30px;
    border:1px solid #ccc;
    outline:none;
}

.input-box i{
    position:absolute;
    top:13px;
    left:15px;
    color:#777;
}

button{
    width:100%;
    background:linear-gradient(45deg,#1d2671,#c33764);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

button:hover{opacity:0.9;}

.options{
    text-align:center;
    margin-top:15px;
}

.options a{
    color:#1d2671;
    text-decoration:none;
    font-weight:600;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="left">
        <div class="overlay">
            <h1>Welcome Students 🎓</h1>
            <p>XYZ College Online Portal<br>
            Login to access attendance, marks, and notices.</p>
        </div>
    </div>

    <div class="right">
        <h2>Student Login</h2>

        <div class="input-box">
            <i class="fa fa-id-card"></i>
            <input type="text" placeholder="Register Number" required>
        </div>

        <div class="input-box">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Student Name" required>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Password" required>
        </div>

        <button>LOGIN</button>

        <div class="options">
            <p><a href="#">Forgot Password?</a> | <a href="#">New Student?</a></p>
        </div>
    </div>

</div>

</body>
</html>
